  mid: ["mid", "intermediate", "specialist II", "engineer II", "consultant", "analyst", "practitioner"]
  senior: ["senior", "sr", "lead", "principal", "staff", "architect", "specialist III", "senior engineer", "senior analyst"]
  manager_executive: ["manager", "director", "head of", "vp", "vice president", "chief", "cto", "cio", "cfo", "general manager", "superintendent"]

lead_scoring:
  hot:
    ats_score_max: 59.99
    requires_consent: true
    requires_email: true
    requires_phone: true
    reason: "Low ATS score (<60) indicates urgent need for resume overhaul and career coaching; consented with verified contact details."
  warm:
    ats_score_min: 60.0
    ats_score_max: 74.99
    requires_consent: true
    reason: "Moderate ATS score (60-74); candidate has viable baseline but needs targeted keyword optimization and placement assistance."
  cold:
    ats_score_min: 75.0
    requires_consent: true
    reason: "Strong ATS score (75+); lower immediate coaching urgency, suitable for direct talent pool or executive staffing."

retention:
  purge_days: 365
  anonymize_scores: true
