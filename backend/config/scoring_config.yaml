scoring_version: "1.0.0"

mode_a:
  weights:
    file_format_readability: 25
    contact_basic_info: 10
    section_structure: 20
    experience_quality: 20
    skills_and_keywords: 15
    education_certifications: 10
  criteria:
    max_pages_ideal: 2
    warn_pages_above: 3
    bullet_action_verb_target_ratio: 0.70
    quantified_impact_target_ratio: 0.35

mode_b:
  weights:
    hard_skills_keyword_match: 35
    job_title_seniority_alignment: 15
    experience_relevance_years: 15
    education_certification_requirements: 10
    soft_skills_responsibilities_coverage: 10
    formatting_parseability: 10
    location_work_auth_mentions: 5
  tfidf:
    max_features: 500
    ngram_range: [1, 2]
    max_capped_score: 10

